<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Meta Tags -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="About Shazzreen Elyana - Graphic designer passionate about creating meaningful visual experiences.">
  <meta name="keywords" content="graphic designer, about me, biography, creative designer">
  <meta name="author" content="Shazzreen Elyana">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">

  <!-- Page Title -->
  <title>About Me - Shazzreen Elyana</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="index">

  <!-- Navigation -->
  <div id="site-navigation"></div>

  <!-- Page Content Container -->
  <div id="page-content">
    <!-- Content loaded from pages/about.html -->
  </div>

  <!-- Footer -->
  <div id="site-footer"></div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>

  <!-- Component Loader -->
  <script src="assets/js/components.js"></script>

  <!-- Page Content Loader -->
  <script>
    (function() {
      // Load page content from pages/about.html
      fetch('pages/about.html')
        .then(response => response.text())
        .then(html => {
          // Parse the HTML
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, 'text/html');

          // Extract content between navigation and footer
          // Get all sections and main content, excluding nav/footer containers
          const body = doc.body;
          const content = [];

          // Get all children except navigation and footer placeholders
          for (const child of body.children) {
            if (child.id !== 'site-navigation' &&
                child.id !== 'site-footer' &&
                child.tagName !== 'SCRIPT') {
              // Fix paths: ../assets/ -> assets/
              let html = child.outerHTML;
              html = html.replace(/\.\.\/assets\//g, 'assets/');
              html = html.replace(/\.\.\/index\.html/g, 'index.html');
              content.push(html);
            }
          }

          // Insert content into page-content container
          const container = document.getElementById('page-content');
          if (container) {
            container.innerHTML = content.join('\n');
          }
        })
        .catch(error => {
          console.error('Error loading page content:', error);
          document.getElementById('page-content').innerHTML = `
            <div class="container" style="margin-top: 120px;">
              <div class="alert alert-warning">
                <strong>Content loading...</strong><br>
                <small>If you're opening this file directly, please use a local server like VS Code Live Server.</small>
              </div>
            </div>
          `;
        });
    })();
  </script>

  <!-- Custom JavaScript -->
  <script src="assets/js/script.js"></script>

</body>
</html>
